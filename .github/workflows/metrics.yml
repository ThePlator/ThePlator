name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # The token MUST be under 'with:', not 'env:'
          token: ${{ secrets.METRICS_TOKEN }}
          user: ThePlator
          template: classic
          base: header, activity, community, repositories, metadata

          plugin_languages: yes
          plugin_isocalendar: yes
          plugin_stars: yes
          plugin_followup: yes

          config_timezone: Asia/Kolkata
